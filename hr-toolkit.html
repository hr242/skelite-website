<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HR Toolkit · SKelite Talent Partners</title>
<meta name="description" content="161 editable Word and Excel HR templates for Indian startups and SMEs. Written against the Labour Codes as they stand in 2026. From Rs 599."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --teal:#1D9E75;--td:#0f6e56;--tdp:#085041;--tdd:#04342C;
  --tl:#9FE1CB;--tp:#e1f5ee;--tm:#5DCAA5;--tg:#f0fbf7;
  --y:#F5C518;--yl:#FFFBEA;--ym:#FDE68A;--yd:#D4A017;
  --gray:#6b7280;--dark:#0a1a14;--ink:#1a2e25;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--tg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
.in{max-width:1180px;margin:0 auto;}
.pg-nav{background:#fff;border-bottom:1px solid var(--tp);padding:14px 5vw;position:sticky;top:0;z-index:50;}
.pg-nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.pg-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:17px;font-weight:800;color:var(--tdp);letter-spacing:-.4px;}
.pg-logo img{height:38px;display:block;border-radius:8px;}
.pg-back{font-size:13px;font-weight:700;color:var(--teal);text-decoration:none;white-space:nowrap;}
.pg-back:hover{color:var(--td);}
.pg-wrap{padding:54px 5vw 72px;}
.pg-card{background:#fff;border:1px solid var(--tp);border-radius:22px;padding:clamp(26px,5vw,48px);box-shadow:0 14px 48px rgba(8,80,65,.06);}
.pg-eyebrow{display:inline-block;background:var(--tp);color:var(--td);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:16px;}
h1.pg-h1{font-size:clamp(26px,4.4vw,38px);font-weight:800;color:var(--tdp);letter-spacing:-1px;line-height:1.14;margin-bottom:10px;}
.pg-updated{font-size:12px;color:var(--gray);margin-bottom:28px;}
.pg-card h2{font-size:17px;font-weight:800;color:var(--tdp);margin:28px 0 10px;}
.pg-card p{font-size:14.5px;line-height:1.85;color:var(--ink);margin-bottom:14px;}
.pg-card ul{margin:0 0 16px 20px;}
.pg-card li{font-size:14.5px;line-height:1.85;color:var(--ink);margin-bottom:7px;}
.pg-card a{color:var(--teal);font-weight:700;}
.pg-box{background:var(--tg);border:1.5px solid var(--tl);border-radius:16px;padding:20px 22px;margin:24px 0;}
.pg-box p{margin-bottom:8px;}
.pg-box p:last-child{margin-bottom:0;}
.pg-foot{background:var(--tg);border-top:1px solid var(--tp);color:var(--gray);padding:28px 5vw;text-align:center;font-size:12.5px;line-height:1.8;}
.pg-foot a{color:var(--td);text-decoration:none;font-weight:600;}
.pg-foot a:hover{text-decoration:underline;}
@media(max-width:560px){.pg-wrap{padding:30px 4vw 48px;}}
</style>
<link rel="stylesheet" href="/toolkit.css"/>
</head>
<body>
<nav class="pg-nav">
  <div class="pg-nav-in">
    <a href="/" class="pg-logo"><img src="https://i.postimg.cc/LsXPNJD8/SKelite-website-logo.png" alt="SKelite Talent Partners"/></a>
    <a href="/" class="pg-back">← Back to website</a>
  </div>
</nav>
<div class="pg-wrap"><div class="in">
  <div id="toolkit-mount" data-h1="true"></div>
</div></div>
<footer class="pg-foot">
  <div class="in">
    © 2025–26 SKelite Talent Partners. All rights reserved.<br/>
    <a href="mailto:hr@skelite-talent.com">hr@skelite-talent.com</a> · +91 8103108993<br/>
    <a href="/">Home</a> · <a href="/hr-toolkit">HR Toolkit</a> · <a href="/refund-policy">Refund &amp; Cancellation</a> · <a href="/delivery-policy">Delivery</a>
  </div>
</footer>
<script src="/toolkit.js"></script>
</body>
</html>
